[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-agent"
version = "0.1.0"
description = "A proactive, recoverable agent runtime for IM conversations"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
active-agent = "active_agent.cli:main"
active-agent-mcp = "active_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["active_agent*"]

[tool.setuptools.package-data]
active_agent = ["web/*.html"]
